# Hook: a ConfigMap, so Helm does not wait for a Job controller envtest lacks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pre
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  hookMessage: {{ .Values.hookMessage | quote }}
